[project]
name = "procedure-composer"
version = "0.2.0"
description = "Data-only single-file procedure composition with source provenance"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procedure_composer"]
