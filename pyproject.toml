[project]
name = "agent-memory-system"
version = "0.1.0"
description = "agent-memory-system — memory-core control files (procedures, storage-backend seam, templates) and their tooling for the 5-layer agent memory architecture."
readme = "README.md"
authors = [
    { name = "Alviandi Widiasto", email = "alviandi@msn.com" }
]
requires-python = ">=3.12"

# This repo ships markdown procedures + a few standalone helper scripts, not an
# installable package — so it is never built/distributed.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle, pyflakes, isort

[tool.pytest.ini_options]
testpaths = ["tests"]
